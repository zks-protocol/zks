name = "zks-protocol-signaling"
main = "src/index.js"
compatibility_date = "2024-01-01"

[env.production]
name = "zks-protocol-signaling-prod"

[env.staging]
name = "zks-protocol-signaling-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
MAX_PEERS_PER_ROOM = "50"
MESSAGE_RATE_LIMIT = "100"
ROOM_EXPIRY_HOURS = "24"


[durable_objects]
bindings = [
  { name = "SIGNALING_ROOM", class_name = "SignalingRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

[vars]
ENVIRONMENT = "production"
MAX_PEERS_PER_ROOM = "50"
MESSAGE_RATE_LIMIT = "100"
ROOM_EXPIRY_HOURS = "24"