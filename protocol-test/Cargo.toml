[package]
name = "protocol-test"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
zks = { version = "0.1.0", path = "../crates/zks_sdk" }
zks_wire = { version = "0.1.0", path = "../crates/zks_wire" }
anyhow = { version = "1.0", features = ["backtrace"] }
bytes = "1.0"
libp2p = { version = "0.53.0", features = ["full", "tokio"] }
regex = "1.5"
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.21"
uuid = { version = "1.0", features = ["v4"] }


