name: Rust Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build zks-node (release)
      run: cargo build --package zks_wire --bin zks-node --release --verbose

    - name: Build zks-test (release)
      run: cargo build --package zks_wire --bin zks-test --release --verbose

    - name: Build signaling-server (release)
      run: cargo build --package signaling-server --release --verbose

    - name: Build protocol-test (release)
      run: cargo build --package protocol-test --release --verbose

    - name: Prepare Release Bundle
      run: |
        mkdir -p dist
        cp target/release/zks-node dist/
        cp target/release/zks-test dist/
        cp target/release/signaling-server dist/
        cp target/release/protocol-test dist/
        chmod +x dist/*
        cd dist && tar czf ../zks-linux-x86_64.tar.gz * && cd ..

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zks-release-bundle-linux
        path: dist/
        retention-days: 30

    # --- Release job: creates a GitHub Release on tag push or manual trigger ---

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build #{0}', github.run_number) }}
        body: |
          ## ZKS Protocol Release

          **Binaries included (Linux x86_64):**
          - `zks-node` — Relay node for the ZKS swarm network
          - `zks-test` — CLI test client (build, bench, continuous, listen)
          - `signaling-server` — Native signaling server
          - `protocol-test` — Protocol integration tests

          **Deploy to VPS:**
          ```bash
          # Download and extract
          wget https://github.com/${{ github.repository }}/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}/zks-linux-x86_64.tar.gz
          tar xzf zks-linux-x86_64.tar.gz
          chmod +x zks-node zks-test

          # Run
          RUST_LOG=debug ./zks-node \
              --bind-addr 0.0.0.0:4001 \
              --signaling-url wss://zks-protocol-signaling.md-wasif-faisal.workers.dev \
              --network zks-test-v1 \
              --verbose
          ```
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        files: |
          zks-linux-x86_64.tar.gz
          dist/zks-node
          dist/zks-test
          dist/signaling-server
          dist/protocol-test
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
