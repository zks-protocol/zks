name: Rust Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libssl-dev pkg-config build-essential

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build zks-node (release)
      run: cargo build --package zks_wire --bin zks-node --release --verbose

    - name: Build signaling-server (release)
      run: cargo build --package signaling-server --release --verbose

    - name: Build zks-test (release)
      run: cargo build --package zks_wire --bin zks-test --release --verbose

    - name: Build protocol-test (release)
      run: cargo build --package protocol-test --release --verbose

    - name: Prepare Binaries for Upload
      run: |
        mkdir -p dist
        cp target/release/zks-node dist/
        cp target/release/signaling-server dist/
        cp target/release/zks-test dist/
        cp target/release/protocol-test dist/

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: zks-release-bundle-linux
        path: dist/
        retention-days: 30
