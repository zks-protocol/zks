name: Rust Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Cargo Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build zks-node (release)
      run: cargo build --package zks_wire --bin zks-node --release --verbose

    - name: Build signaling-server (release)
      run: cargo build --package signaling-server --release --verbose

    - name: Build zks-test (release)
      run: cargo build --package zks_wire --bin zks-test --release --verbose

    - name: Build protocol-test (release)
      run: cargo build --package protocol-test --release --verbose

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: zks-release-bundle-linux
        path: |
          target/release/zks-node
          target/release/signaling-server
          target/release/zks-test
          target/release/protocol-test
        retention-days: 30
